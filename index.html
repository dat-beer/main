<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Rice Beer Right Here</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300&display=swap" rel="stylesheet">
  <style>
    body {
      background: #e6f4ec;
      margin: 0;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      color: #38a536;
      box-sizing: border-box;
    }
    .container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 2em 10vw 2em 10vw;
      display: flex;
      flex-direction: column;
    }
    .main-title {
      font-size: 2.7em;
      font-weight: 300;
      margin-bottom: 1.2em;
      line-height: 1.19;
      word-break: break-word;
      letter-spacing: 0.5px;
      max-width: 40em;
    }
    .percent {
      color: #b6c7b6;
      font-size: 1em;
      font-weight: 300;
      vertical-align: super;
      margin: 0 8px;
    }
    .list {
      margin-left: 0;
      margin-bottom: 2.8em;
      padding-left: 0;
      list-style: none;
      max-width: 35em;
    }
    .list-item {
      font-size: 1.7em;
      font-weight: 300;
      margin-bottom: 0.8em;
      padding-left: 2em;
      position: relative;
      line-height: 1.15;
    }
    .list-item::before {
      content: "○";
      color: #38a536;
      font-size: 1em;
      position: absolute;
      left: 0;
      top: 0.16em;
      font-weight: 300;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
    }
    .return-section {
      margin: 2.3em 0 1em 0;
      color: #38a536;
      font-size: 2.7em;
      font-weight: 300;
      line-height: 1.21;
      max-width: 42em;
      word-break: break-word;
    }
    .percent2 {
      color: #b6c7b6;
      font-size: 1em;
      font-weight: 300;
      margin: 0 8px;
      vertical-align: super;
    }
    .footer {
      position: static;
      margin-top: 2.5em;
      font-size: 1.5em;
      font-weight: 300;
      line-height: 1.28;
      color: #38a536;
      letter-spacing: 0.23px;
      word-break: break-word;
      max-width: 38em;
    }
    .footer .footer-line {
      margin-bottom: 0.5em;
    }
    .footer .footer-email {
      color: #b6c7b6;
      text-decoration: none;
      font-weight: 300;
      margin-left: 9px;
    }
    @media (max-width: 900px) {
      .container {
        padding: 3vw 3vw 7vw 3vw;
      }
      .main-title,
      .return-section {
        font-size: 3.2em;
        max-width: 100vw;
      }
      .list {
        max-width: 94vw;
      }
      .list-item {
        font-size: 2em;
        padding-left: 2em;
      }
      .footer {
        font-size: 2.2em;
        max-width: 98vw;
      }
    }
    @media (max-width: 600px) {
      .container {
        padding: 2vw 2vw 6vw 2vw;
      }
      .main-title,
      .return-section {
        font-size: 3.7em;
        margin-bottom: 0.6em;
      }
      .percent, .percent2 {
        font-size: 1em;
        margin: 0 10px;
      }
      .list-item {
        font-size: 2.4em;
        margin-bottom: 0.46em;
        padding-left: 2.4em;
      }
      .footer {
        font-size: 2.5em;
        margin-top: 2.5em;
      }
    }
    @media (max-width: 400px) {
      .container {
        padding: 2vw 0 4vw 0;
      }
      .main-title,
      .return-section {
        font-size: 2.2em;
        margin-bottom: 0.18em;
      }
      .percent, .percent2 {
        font-size: 1em;
        margin: 0 6px;
      }
      .list-item {
        font-size: 1.17em;
      }
      .footer {
        font-size: 1.4em;
        margin-top: 1em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-title">
      ölät <span class="percent">2.2%</span> finns att köpa på:
    </div>
    <ul class="list">
      <li class="list-item">Kiosko Import</li>
      <li class="list-item">Karombar</li>
      <li class="list-item">Folköl &amp; DunkaDunka</li>
    </ul>
    <div class="return-section">
      ölät <span class="percent2">5.3%</span> förväntas komma<br> tillbaka lagom till vintern.
    </div>
    <div class="footer">
      <div class="footer-line">för förfrågningar, du kan</div>
      <div class="footer-line">
        skriva till: <a class="footer-email" href="mailto:dat@drinkdat.beer">dat@drinkdat.beer</a>
      </div>
    </div>
  </div>
</body>
</html>
