<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beer Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
            width: 100%;
            min-height: 100vh;
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            overflow-x: hidden;
        }
        .landing-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }
        .landing-text {
            color: #0A2719;
            font-size: 6.7vw;
            line-height: 1;
            max-width: 90%;
        }
        .landing-text span:nth-child(2) {
            display: block;
            margin-top: 0.5em;
            text-decoration: none;
            color: #0A2719;
            -webkit-tap-highlight-color: transparent;
        }
        .landing-text span:nth-child(3) {
            display: block;
            margin-top: 0.4em;
        }
        .landing-text a[href^="tel"] {
            color: #0A2719 !important;
            text-decoration: none !important;
            pointer-events: none;
        }
        .footer-text {
            position: absolute;
            bottom: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 0.89vw;
            color: #0A2719;
            width: 90%;
            max-width: 1200px;
            text-align: center;
        }
        .footer-text span {
            color: #FF032C;
        }
        @media screen and (max-width: 768px) {
            .landing-text {
                font-size: 10vw;
                max-width: 95%;
            }
            .landing-text span:nth-child(2) {
                margin-top: 0.5em;
                text-decoration: none;
                color: #0A2719;
                -webkit-tap-highlight-color: transparent;
            }
            .landing-text span:nth-child(3) {
                margin-top: 0.4em;
            }
            .landing-text a[href^="tel"] {
                color: #0A2719 !important;
                text-decoration: none !important;
                pointer-events: none;
            }
            .footer-text {
                font-family: 'Inter', sans-serif;
                font-size: 3.5vw;
                bottom: 10px;
            }
            .footer-text {
                text-align: center;
            }
            .landing-section {
                padding: 10px;
                min-height: 80vh;
            }
        }
        @media screen and (max-width: 480px) {
            .landing-text {
                font-size: 12vw;
            }
            .footer-text {
                font-size: 4.5vw;
            }
        }
    </style>
</head>
<body>
    <section class="landing-section">
        <!-- Text removed -->
    </section>
</body>
</html>
