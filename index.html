<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ò drinkdatbeer – Malmö’s Rice Beer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', Arial, sans-serif;
      background: #F8F9FA;
      color: #2E2E2E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: #FFF;
      border-radius: 18px;
      box-shadow: 0 2px 18px rgba(0,0,0,0.05);
      padding: 2.5rem 2rem 2rem 2rem;
      max-width: 480px;
      width: 100%;
      margin: 5vw;
      text-align: center;
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #507B66;
      margin-bottom: 0.5em;
    }
    .subtitle {
      font-size: 1.25rem;
      font-weight: 400;
      color: #6B7C85;
      margin-bottom: 1.5em;
    }
    ul {
      text-align: left;
      margin: 1.5em auto 1.5em auto;
      padding-left: 0;
      list-style: none;
      font-size: 1.11rem;
      line-height: 1.5;
      letter-spacing: .01em;
    }
    li {
      margin: 1.2em 0;
      /* Ensures numbers and text align well */
    }
    .abv {
      font-weight: bold;
      color: #354B41;
      font-size: 1em; /* Let it scale with parent */
      letter-spacing: 0.01em;
    }
    .contact {
      margin-top: 2em;
      font-size: 1.13rem;
      background: #F2F7F1;
      border-radius: 12px;
      padding: 1.2em 1em;
      color: #354B41;
      word-break: break-word;
    }
    .contact a {
      color: #507B66;
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      margin: 0.3em 0;
      transition: color 0.2s;
    }
    .contact a:hover, .contact a:focus {
      color: #314D3A;
    }

    /* MOBILE: Bigger font, wider use of space */
    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        justify-content: flex-start;
        background: #F8F9FA;
      }
      .container {
        max-width: 99vw;
        padding: 2.2rem 3vw 2rem 3vw;
        margin: 2vw auto;
        border-radius: 15px;
      }
      h1 {
        font-size: 2rem;
        letter-spacing: 0.03em;
      }
      .subtitle {
        font-size: 1.17rem;
      }
      ul {
        font-size: 1.13rem;
        line-height: 1.7;
      }
      .abv {
        font-size: 1em;
      }
      .contact {
        font-size: 1.07rem;
        padding: 1em 0.6em;
      }
    }
    @media (max-width: 400px) {
      .container {
        padding: 1rem 1vw;
      }
      h1 {
        font-size: 1.3rem;
      }
      .subtitle {
        font-size: 0.99rem;
      }
      ul {
        font-size: 1em;
      }
      .contact {
        font-size: 0.99rem;
        padding: 0.7em 0.2em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ò drinkdatbeer</h1>
    <div class="subtitle">Rice beers by Dat &mdash; Malmö, Sweden</div>
    <ul>
      <li>• Try our <span class="abv">2.2%</span> and <span class="abv">5.3%</span> rice beers, releasing up to <b>200 cans per month</b>.</li>
      <li>• Find Dat’s beers at <b>Kiosko Import</b>, <b>Karombar</b>, <b>Folköl O DunkaDunka</b>, and at <b>pop-up events around Malmö</b>.</li>
    </ul>
    <div class="contact">
      For contact or pre-orders:<br>
      <a href="mailto:dat@drinkdat.beer">dat@drinkdat.beer</a><br>
      <a href="tel:0709558025">070 955 80 25</a>
    </div>
  </div>
</body>
</html>
