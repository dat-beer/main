<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Rice Beer Right Here</title>
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300&display=swap" rel="stylesheet">
  <style>
    body {
      background: #e6f4ec;
      margin: 0;
      width: 1920px;
      height: 1080px;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      box-sizing: border-box;
      color: #38a536;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      padding: 38px 0 0 48px;
    }
    .main-title {
      font-size: 54px;
      font-weight: 300;
      margin-bottom: 16px;
      line-height: 1.1;
      letter-spacing: 0.5px;
    }
    .percent {
      color: #b6c7b6;
      font-size: 44px;
      font-weight: 300;
      vertical-align: super;
      margin-right: 7px;
      margin-left: 7px;
    }
    .list {
      margin-left: 0;
      margin-bottom: 56px;
      padding-left: 32px; /* space for bullet */
      color: #38a536;
      list-style: none;
    }
    .list-item {
      font-size: 48px;
      font-weight: 300;
      margin-bottom: 8px;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      line-height: 1.07;
      position: relative;
      padding-left: 44px;
    }
    .list-item::before {
      content: "○";
      color: #38a536; /* green bullet matches text */
      font-size: 38px;
      position: absolute;
      left: 0;
      top: 2px;
      line-height: 1;
      font-weight: 300;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
    }
    .return-section {
      margin-top: 58px;
      margin-bottom: 64px;
      color: #38a536;
      font-size: 54px;
      font-weight: 300;
      line-height: 1.18;
      max-width: 900px;
    }
    .percent2 {
      color: #b6c7b6;
      font-size: 44px;
      font-weight: 300;
      margin-right: 7px;
      margin-left: 7px;
      vertical-align: super;
    }
    .footer {
      position: absolute;
      left: 48px;
      bottom: 70px;
      font-size: 48px;
      font-weight: 300;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      line-height: 1.18;
      color: #38a536;
      letter-spacing: 0.2px;
    }
    .footer .footer-line {
      margin-bottom: 5px;
    }
    .footer .footer-email {
      color: #b6c7b6;
      text-decoration: none;
      font-size: 48px;
      font-weight: 300;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      margin-left: 7px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-title">
      ölät <span class="percent">2.2%</span> finns att köpa på:
    </div>
    <ul class="list">
      <li class="list-item">Kiosko Import</li>
      <li class="list-item">Karombar</li>
      <li class="list-item">Folköl &amp; DunkaDunka</li>
    </ul>

    <div class="return-section">
      ölät <span class="percent2">5.3%</span> förväntas komma<br> tillbaka lagom till vintern.
    </div>

    <div class="footer">
      <div class="footer-line">för förfrågningar, du kan</div>
      <div class="footer-line">
        skriva till: <a class="footer-email" href="mailto:dat@drinkdat.beer">dat@drinkdat.beer</a>
      </div>
    </div>
  </div>
</body>
</html>
