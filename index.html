<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Rice Beer Right Here</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300&display=swap" rel="stylesheet">
  <style>
    body {
      background: #e6f4ec;
      margin: 0;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      color: #38a536;
      box-sizing: border-box;
    }
    .container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 2em 4vw 2em 4vw;
      display: flex;
      flex-direction: column;
    }
    .main-title {
      font-size: 2.2em;
      font-weight: 300;
      margin-bottom: 0.8em;
      line-height: 1.18;
      word-break: break-word;
      letter-spacing: 0.5px;
    }
    .percent {
      color: #b6c7b6;
      font-size: 1em; /* scales with heading */
      font-weight: 300;
      vertical-align: super;
      margin: 0 6px;
    }
    .list {
      margin-left: 0;
      margin-bottom: 2em;
      padding-left: 0;
      list-style: none;
    }
    .list-item {
      font-size: 1.23em;
      font-weight: 300;
      margin-bottom: 0.65em;
      padding-left: 2em;
      position: relative;
      line-height: 1.1;
    }
    .list-item::before {
      content: "○";
      color: #38a536;
      font-size: 1em;
      position: absolute;
      left: 0;
      top: 0.08em;
      font-weight: 300;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
    }
    .return-section {
      margin: 2em 0 .5em 0;
      color: #38a536;
      font-size: 2em;
      font-weight: 300;
      line-height: 1.2;
      max-width: 98vw;
      word-break: break-word;
    }
    .percent2 {
      color: #b6c7b6;
      font-size: 1em; /* scales with .return-section */
      font-weight: 300;
      margin: 0 6px;
      vertical-align: super;
    }
    .footer {
      position: static;
      margin-top: 2em;
      font-size: 1.1em;
      font-weight: 300;
      line-height: 1.25;
      color: #38a536;
      letter-spacing: 0.2px;
      word-break: break-word;
    }
    .footer .footer-line {
      margin-bottom: 0.3em;
    }
    .footer .footer-email {
      color: #b6c7b6;
      text-decoration: none;
      font-weight: 300;
      margin-left: 7px;
    }
    @media (max-width:700px) {
      .main-title, .return-section { font-size: 1.25em; }
      .container { padding: 1.2em 3vw .8em 3vw; }
      .list-item { font-size: 0.94em; padding-left: 1.22em;}
      .footer { font-size: 0.95em; margin-top: 1.3em;}
    }
    @media (max-width:400px) {
      .main-title, .return-section { font-size: 0.92em; }
      .container { padding: 0.7em 2vw .6em 2vw; }
      .list-item { font-size: 0.81em; }
      .footer { font-size: 0.84em; margin-top: 0.7em;}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-title">
      ölät <span class="percent">2.2%</span> finns att köpa på:
    </div>
    <ul class="list">
      <li class="list-item">Kiosko Import</li>
      <li class="list-item">Karombar</li>
      <li class="list-item">Folköl &amp; DunkaDunka</li>
    </ul>
    <div class="return-section">
      ölät <span class="percent2">5.3%</span> förväntas komma<br> tillbaka lagom till vintern.
    </div>
    <div class="footer">
      <div class="footer-line">för förfrågningar, du kan</div>
      <div class="footer-line">
        skriva till: <a class="footer-email" href="mailto:dat@drinkdat.beer">dat@drinkdat.beer</a>
      </div>
    </div>
  </div>
</body>
</html>
