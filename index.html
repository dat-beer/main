<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Rice Beer Right Here</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #38a536;
      --gray: #b6c7b6;
      --bg: #e6f4ec;
      --maxwidth: 1500px;
    }
    body {
      background: var(--bg);
      margin: 0;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      color: var(--green);
      box-sizing: border-box;
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      max-width: var(--maxwidth);
      margin: 0 auto;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 36px 0 48px 48px;
    }
    .main-title {
      font-size: 54px;
      font-weight: 300;
      line-height: 1.06;
      margin-bottom: 22px;
      letter-spacing: 0.3px;
    }
    .percent {
      color: var(--gray);
      font-size: 44px;
      font-weight: 300;
      vertical-align: super;
      margin: 0 6px;
    }
    .list {
      margin: 0 0 0 24px;
      padding: 0;
      list-style: none;
    }
    .list-item {
      font-size: 48px;
      font-weight: 300;
      margin-bottom: 10px;
      padding-left: 36px;
      position: relative;
      line-height: 1.08;
    }
    .list-item::before {
      content: "○";
      color: var(--green);
      font-size: 38px;
      position: absolute;
      left: 0;
      top: 0.09em;
      font-weight: 300;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
    }
    .section-spacer {
      height: 80px;
    }
    .return-section {
      font-size: 54px;
      font-weight: 300;
      line-height: 1.14;
      margin-bottom: 110px;
      color: var(--green);
    }
    .percent2 {
      color: var(--gray);
      font-size: 44px;
      font-weight: 300;
      vertical-align: super;
      margin: 0 6px;
    }
    .footer {
      position: absolute;
      left: 48px;
      bottom: 48px;
      font-size: 44px;
      font-weight: 300;
      color: var(--green);
      line-height: 1.1;
    }
    .footer-email {
      color: var(--gray);
      text-decoration: none;
      font-size: 44px;
      font-weight: 300;
      margin-left: 0.2em;
    }
    @media (max-width: 1050px) {
      .container,
      .footer {
        padding-left: 18px;
        left: 18px;
      }
    }
    @media (max-width: 760px) {
      .container {
        padding: 24px 0 22px 5vw;
        min-width: 0;
      }
      .main-title { font-size: 27vw; }
      .return-section { font-size: 26vw; }
      .footer, .footer-email { font-size: 22vw; }
      .list-item { font-size: 24vw; padding-left: 8vw; }
      .list-item::before { font-size: 7vw; }
      .percent, .percent2 { font-size: 17vw; }
      .footer { left: 5vw; bottom: 5vw; }
      .section-spacer { height: 6vw; }
    }
    @media (max-width: 600px) {
      .container {
        padding-top: 5vw;
        padding-left: 3vw;
        padding-bottom: 15vw;
      }
      .main-title,
      .return-section {
        font-size: 7vw;
        margin-bottom: 4vw;
      }
      .list-item {
        font-size: 5.6vw;
        margin-bottom: 2vw;
        padding-left: 2.7vw;
      }
      .list-item::before {
        font-size: 2vw;
      }
      .percent, .percent2 {
        font-size: 2.1vw;
      }
      .footer, .footer-email {
        font-size: 5vw;
        left: 3vw;
        bottom: 6vw;
      }
    }
    @media (max-width: 480px) {
      .container { padding-left: 3vw; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-title">
      ölät <span class="percent">2.2%</span> finns att köpa på:
    </div>
    <ul class="list">
      <li class="list-item">Kiosko Import</li>
      <li class="list-item">Karombar</li>
      <li class="list-item">Folköl &amp; DunkaDunka</li>
    </ul>
    <div class="section-spacer"></div>
    <div class="return-section">
      ölät <span class="percent2">5.3%</span> förväntas komma<br> tillbaka lagom till vintern.
    </div>
    <div class="footer">
      för förfrågningar, du kan<br>
      skriva till: <span class="footer-email">dat@drinkdat.beer</span>
    </div>
  </div>
</body>
</html>
