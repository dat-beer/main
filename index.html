<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Rice Beer Right Here</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300&display=swap" rel="stylesheet">
  <style>
    body {
      background: #e6f4ec;
      margin: 0;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      box-sizing: border-box;
      color: #38a536;
    }
    .container {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 28px 10px 0 16px;
    }
    .main-title {
      font-size: 2.2em;
      font-weight: 300;
      margin-bottom: 12px;
      line-height: 1.16;
      letter-spacing: 0.5px;
      word-break: break-word;
    }
    .percent {
      color: #b6c7b6;
      font-size: 1.3em;
      font-weight: 300;
      vertical-align: super;
      margin: 0 5px;
    }
    .list {
      margin-left: 0;
      margin-bottom: 36px;
      padding-left: 22px;
      color: #38a536;
      list-style: none;
    }
    .list-item {
      font-size: 1.65em;
      font-weight: 300;
      margin-bottom: 4px;
      position: relative;
      padding-left: 30px;
      line-height: 1.1;
      word-break: break-word;
    }
    .list-item::before {
      content: "○";
      color: #38a536;
      font-size: 0.9em;
      position: absolute;
      left: 0;
      top: 0.08em;
      line-height: 1;
      font-weight: 300;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
    }
    .return-section {
      margin-top: 34px;
      margin-bottom: 36px;
      color: #38a536;
      font-size: 2em;
      font-weight: 300;
      line-height: 1.23;
      max-width: 98vw;
      word-break: break-word;
    }
    .percent2 {
      color: #b6c7b6;
      font-size: 1.3em;
      font-weight: 300;
      margin: 0 5px;
      vertical-align: super;
    }
    .footer {
      position: static;
      margin-top: 24px;
      font-size: 1.15em;
      font-weight: 300;
      line-height: 1.23;
      color: #38a536;
      letter-spacing: 0.2px;
      word-break: break-word;
    }
    .footer .footer-line {
      margin-bottom: 2px;
    }
    .footer .footer-email {
      color: #b6c7b6;
      text-decoration: none;
      font-weight: 300;
      margin-left: 7px;
    }
    @media (max-width: 600px) {
      .container {
        padding: 18px 4vw 0 4vw;
      }
      .main-title {
        font-size: 1.25em;
        margin-bottom: 7px;
      }
      .list {
        margin-bottom: 18px;
        padding-left: 16px;
      }
      .list-item {
        font-size: 1em;
        padding-left: 22px;
        margin-bottom: 2px;
      }
      .list-item::before {
        left: 0;
        font-size: 1.1em;
        top: 0.1em;
      }
      .return-section {
        font-size: 1.1em;
        margin-top: 18px;
        margin-bottom: 16px;
        max-width: 100vw;
      }
      .footer {
        font-size: 1em;
        margin-top: 12px;
      }
    }
    @media (max-width: 400px) {
      .container {
        padding: 12px 2vw 0 2vw;
      }
      .main-title {
        font-size: 0.95em;
      }
      .list-item {
        font-size: 0.9em;
      }
      .return-section {
        font-size: 0.92em;
      }
      .footer {
        font-size: 0.94em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-title">
      ölät <span class="percent">2.2%</span> finns att köpa på:
    </div>
    <ul class="list">
      <li class="list-item">Kiosko Import</li>
      <li class="list-item">Karombar</li>
      <li class="list-item">Folköl &amp; DunkaDunka</li>
    </ul>
    <div class="return-section">
      ölät <span class="percent2">5.3%</span> förväntas komma<br> tillbaka lagom till vintern.
    </div>
    <div class="footer">
      <div class="footer-line">för förfrågningar, du kan</div>
      <div class="footer-line">
        skriva till: <a class="footer-email" href="mailto:dat@drinkdat.beer">dat@drinkdat.beer</a>
      </div>
    </div>
  </div>
</body>
</html>
