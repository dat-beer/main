<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Rice Beer Right Here</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #38a536;
      --gray: #b6c7b6;
      --bg: #e6f4ec;
      --main-size: 48px;
      --mobile-size: 7vw;
      --mobile-maxwidth: 94vw;
    }
    body {
      background: var(--bg);
      margin: 0;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      color: var(--green);
      box-sizing: border-box;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      padding: 48px 0 0 48px;
      position: relative;
    }
    .alltext {
      font-size: var(--main-size);
      font-weight: 300;
      line-height: 1.18;
      margin-bottom: 32px;
    }
    .percent, .percent2 {
      color: var(--gray);
      font-size: .6em;
      font-weight: 300;
      vertical-align: sub;
      margin: 0 4px;
      letter-spacing: 0.2px;
      position: relative;
    }
    ul.list { 
      margin-left: 24px;
      margin-bottom: 48px;
      padding: 0;
      list-style: none;
    }
    .list-item {
      font-size: var(--main-size);
      font-weight: 300;
      margin-bottom: 8px;
      padding-left: 36px;
      position: relative;
      line-height: 1.09;
    }
    .list-item::before {
      content: "○";
      color: var(--green);
      font-size: 38px;
      position: absolute;
      left: 0;
      top: 0.09em;
      font-weight: 300;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
    }
    .return-section {
      font-size: var(--main-size);
      font-weight: 300;
      line-height: 1.18;
      margin-bottom: 40px;
      color: var(--green);
    }
    .footer {
      font-size: var(--main-size);
      font-weight: 300;
      color: var(--green);
      line-height: 1.18;
      position: absolute;
      left: 48px;
      right: 48px;
      bottom: 48px;
      margin: 0;
      text-align: left;
    }
    .footer-email {
      color: var(--gray);
      text-decoration: none;
      font-size: inherit;
      font-weight: inherit;
      margin-left: 0.2em;
    }
    @media (max-width: 900px) {
      .container {padding-left: 7vw;}
      ul.list {margin-left: 3vw;}
      .footer {left: 7vw; right: 7vw;}
    }
    @media (max-width: 700px) {
      .container {
        max-width: var(--mobile-maxwidth);
        padding: 7vw 0 7vw 0;
        align-items: center;
      }
      .alltext,
      .list-item,
      .return-section,
      .footer {
        font-size: var(--mobile-size);
        margin-bottom: 4vw;
        max-width: var(--mobile-maxwidth);
        width: 100%;
        text-align: center;
      }
      ul.list {
        margin-left: 0;
        margin-bottom: 5vw;
        width: 100%;
        padding: 0;
      }
      .list-item { 
        font-size: var(--mobile-size);
        padding-left: 7vw; 
        margin-bottom: 3vw;
        max-width: var(--mobile-maxwidth); 
        text-align: left;
        display: block;
      }
      .list-item::before { font-size: 6vw; }
      .percent, .percent2 { font-size: .6em; vertical-align: sub; }
      .footer {
        position: static;
        left: auto;
        right: auto;
        bottom: auto;
        margin-top: 5vw;
        margin-bottom: 2vw;
        text-align: center;
      }
      .footer-email { margin-left: 0.2vw; color: var(--gray);}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="alltext">
      ölät <span class="percent">2.2%</span> finns att köpa på:
    </div>
    <ul class="list">
      <li class="list-item">Kiosko Import</li>
      <li class="list-item">Karombar</li>
      <li class="list-item">Folköl &amp; DunkaDunka</li>
    </ul>
    <div class="return-section">
      ölät <span class="percent2">5.3%</span> förväntas komma<br> tillbaka lagom till vintern.
    </div>
    <div class="footer">
      för förfrågningar, du kan skriva till: 
      <a class="footer-email" href="mailto:dat@drinkdat.beer">dat@drinkdat.beer</a>
    </div>
  </div>
</body>
</html>
